<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none">
  <!-- Древний Дредноут-Перехватчик «Карантин» -->
  <rect width="160" height="80" rx="10" fill="#120a1f"/>
  <defs>
    <radialGradient id="dreadEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Грозный монолитный корпус -->
  <path d="M22 18 L92 14 L138 30 L146 40 L138 50 L92 66 L22 62 L34 40 Z"
        fill="#1e1233" stroke="#c084fc" stroke-width="2.4"/>
  <path d="M48 24 L112 24 L126 40 L112 56 L48 56 Z" fill="#0f071c" stroke="#f43f5e" stroke-width="1.6"/>
  <!-- Главный калибр -->
  <circle cx="98" cy="40" r="14" fill="url(#dreadEye)"/>
  <line x1="112" y1="40" x2="156" y2="40" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
  <!-- Ребра брони -->
  <path d="M58 16 V64 M76 15 V65" stroke="#a855f7" stroke-opacity="0.45" stroke-width="2"/>
</svg>
