    <line x1="35" y1="16" x2="35" y2="34" stroke="#38bdf8" stroke-opacity="0.6"/>
    <rect x="68" y="72" width="16" height="14" fill="#0f2942" stroke="#38bdf8" stroke-width="1.4" transform="rotate(14 76 79)"/>
    <!-- Искры в разломе -->
    <path d="M51 44 L59 48 L53 55 L60 60" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
    <!-- Маяк SOS -->
    <circle cx="30" cy="52" r="5" fill="#ef4444"/>
    <circle cx="30" cy="52" r="9.5" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.6"/>
  </g>
</svg>
